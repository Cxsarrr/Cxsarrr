<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .fade{animation:fade .9s ease backwards}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hov{animation:float 6s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .pulse{animation:pulse 2.4s infinite}
</style>
<defs>
  <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101A29"/><stop offset=".55" stop-color="#0B121C"/><stop offset="1" stop-color="#0F1E33"/>
  </linearGradient>
  <radialGradient id="gGlow" cx=".85" cy=".1" r=".7">
    <stop offset="0" stop-color="#4A90E2" stop-opacity=".22"/><stop offset="1" stop-color="#4A90E2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gGlow2" cx=".1" cy="1" r=".6">
    <stop offset="0" stop-color="#ABCDEF" stop-opacity=".10"/><stop offset="1" stop-color="#ABCDEF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ABCDEF"/><stop offset="1" stop-color="#4A90E2"/>
  </linearGradient>
  <linearGradient id="gScan" x1="0" x2="1">
    <stop offset="0" stop-color="#ABCDEF" stop-opacity="0"/><stop offset=".5" stop-color="#ABCDEF" stop-opacity=".18"/><stop offset="1" stop-color="#ABCDEF" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="798" height="518" rx="26" fill="url(#gCard)" stroke="#22364F" stroke-width="2"/>
<rect x="1" y="1" width="798" height="518" rx="26" fill="url(#gGlow)"/>
<!-- navegador -->
