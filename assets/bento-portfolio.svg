  <linearGradient id="gBtn" x1="0" x2="1"><stop offset="0" stop-color="#4A90E2"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#7C83FD"/></linearGradient>
</defs>
