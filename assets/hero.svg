<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .fade{animation:fade .9s ease backwards}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rv0{from{transform:translateX(0)}to{transform:translateX(150px)}}.rv0{animation:rv0 0.32s steps(9) 0.40s backwards}
@keyframes rv1{from{transform:translateX(0)}to{transform:translateX(672px)}}.rv1{animation:rv1 0.25s steps(1) 1.06s backwards}
@keyframes rv2{from{transform:translateX(0)}to{transform:translateX(252px)}}.rv2{animation:rv2 0.56s steps(16) 1.51s backwards}
@keyframes rv3{from{transform:translateX(0)}to{transform:translateX(600px)}}.rv3{animation:rv3 0.25s steps(1) 2.42s backwards}
@keyframes rv4{from{transform:translateX(0)}to{transform:translateX(238px)}}.rv4{animation:rv4 0.53s steps(15) 2.88s backwards}
@keyframes rv5{from{transform:translateX(0)}to{transform:translateX(397px)}}.rv5{animation:rv5 0.25s steps(1) 3.75s backwards}
  .caret{animation:pulse 1s steps(2) infinite}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .spin{animation:spin linear infinite;transform-box:view-box;transform-origin:0 0}
  .rev{animation-direction:reverse}
  .tw{animation:pulse 3.5s ease-in-out infinite;opacity:.5}

</style>
