<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .fade{animation:fade .9s ease backwards}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .w1{animation:wave 9s ease-in-out infinite alternate} .w2{animation:wave 13s ease-in-out infinite alternate-reverse} @keyframes wave{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
</style>
<defs><linearGradient id="gF" x1="0" x2="1"><stop offset="0" stop-color="#1F3A63"/><stop offset="1" stop-color="#4A90E2"/></linearGradient></defs>
<path class="w2" d="M-80 120 C200 60 420 170 760 110 S1300 60 1680 120 V220 H-80Z" fill="#1F3A63" opacity=".55"/>
<path class="w1" d="M-80 150 C260 100 520 200 820 140 S1340 100 1680 150 V220 H-80Z" fill="url(#gF)" opacity=".9"/>
<text class="s" x="800" y="200" font-size="22" font-weight="700" fill="#F5F8FC" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Construyamos algo juntos ✦</text>
</svg>
