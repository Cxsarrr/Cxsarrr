<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<style>
  .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .fade{animation:fade .9s ease backwards}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ring{from{stroke-dashoffset:389.6}} .ring{animation:ring 1.6s cubic-bezier(.2,.8,.2,1) .4s backwards} .glow{animation:pulse 3s infinite}
</style>
<defs>
