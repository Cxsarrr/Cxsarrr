name: Actualizar estadísticas del perfil

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:         # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # opcional: token personal para contar contribuciones privadas
        run: python scripts/update_stats.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "🤖 Actualizar estadísticas del perfil [skip ci]"
            git push
          fi
