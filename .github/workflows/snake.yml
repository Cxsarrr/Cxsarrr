name: Serpiente de contribuciones

on:
  schedule:
    - cron: '0 5 * * *'   # una vez al día
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#38BDF8&color_dots=#121C2E,#1E3A66,#2F5FA0,#4A90E2,#9CCBFF&color_dot_border=#070B14

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Actualizar serpiente"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
